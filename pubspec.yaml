name: hackathon_manager
description: "A personal app that keeps every hackathon, its deadlines, its reminders, and your team in one place."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  flutter_local_notifications: ^19.2.1
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.5
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  test: ^1.25.8

flutter:
  uses-material-design: true
